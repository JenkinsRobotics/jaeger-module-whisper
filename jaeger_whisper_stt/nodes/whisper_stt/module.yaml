module: whisper_stt
slot: stt
version: 1.0.0

# The OWNERSHIP axis (TAXONOMY.md "Module KINDS") — orthogonal to
# `slot`. `engine` is the kind that fills a capability slot; swapping
# in Vosk or a cloud STT means swapping this module.
#
# KNOWN DEVIATION: this engine opens the microphone itself, and the
# taxonomy's driver rule says nothing outside a driver-kind module may
# open a device. The clean shape is a mic driver publishing
# /sense/mic/pcm with this module consuming it — which would also let a
# second consumer (a VAD, a recorder) share the mic instead of fighting
# for it. Not restructured here; recorded so the deviation is visible
# rather than implied by an empty `consumes`.
kind: engine

# Topics follow the hierarchy: /<category>/<class>/<message>. Both
# outputs are derived readings — they flow toward the brain, so they
# are /sense/ regardless of having come out of a model rather than off
# a wire.
consumes: []
produces: [/sense/stt/transcript, /sense/stt/speech_start]
tools: [listen]
factory: jaeger_whisper_stt.nodes.whisper_stt:make_audio_session_node
config: whisper_stt        # its group/key in the settings catalog
# Carried over from the old plugin.yaml's `requires.libraries` block
# (pre-0.8 M2b, jaeger_os/plugins/whisper_stt/plugin.yaml) — the
# libraries the engine actually imports at runtime. The availability
# gate (jaeger_os/agent/availability.py) probes these with
# importlib.util.find_spec before reporting `listen` available.
# `models` (whisper-base.en / whisper-medium.en, auto-downloaded) and
# `hardware: [microphone]` aren't libraries importlib can probe, so
# they're skipped here — same call M1 made for kokoro_tts.
requires_libraries: [pywhispercpp, webrtcvad, sounddevice, numpy]
